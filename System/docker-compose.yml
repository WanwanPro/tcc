version: '3.8'

services:
  # MongoDB数据库
  mongodb:
    image: mongo:4.4
    container_name: parking-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: parking_admin
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - parking-network

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parking-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/parking_admin?authSource=admin
      JWT_SECRET: your_jwt_secret_key_change_in_production
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      - mongodb
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    networks:
      - parking-network
    command: >
      sh -c "
        if [ ! -f /app/.env ]; then
          cp /app/.env.example /app/.env;
        fi;
        npm run init-db && npm start
      "

  # 前端Web服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parking-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      REACT_APP_API_URL: http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - parking-network

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: parking-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - parking-network

volumes:
  mongodb_data:

networks:
  parking-network:
    driver: bridge